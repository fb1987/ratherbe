<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rather Be</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html, body { height: 100%; }
      /* Background image holder */
      .bg-frame {
        position: fixed; inset: 0; z-index: -1;
        background-size: cover; background-position: center;
        filter: saturate(0.9);
        transition: background-image .35s ease, filter .35s ease;
      }
      /* Bottom card (white) */
      .rb-card {
        @apply max-w-3xl w-full rounded-3xl border border-black/10 bg-white p-6 md:p-8 shadow-xl text-black;
      }
      /* Inline option pills */
      .rb-pill {
        border-radius: 16px;
        @apply inline-flex items-center justify-center border-2 border-black/70 px-4 py-2 font-medium hover:bg-black/5;
      }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-50 text-black antialiased">
    <div id="bg" class="bg-frame"></div>

    <!-- Page grid: sticky white header + flexible stage -->
    <div class="min-h-screen grid grid-rows-[auto,1fr]">
      <!-- Header (full-width white) -->
      <header class="bg-white border-b border-black/5 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4">
          <h1 class="text-center text-xl font-bold tracking-tight">Rather Be</h1>
        </div>
      </header>

      <!-- Stage -->
      <main class="relative">
        <!-- Onboarding (centered) -->
        <section id="onboarding" class="hidden">
          <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="max-w-2xl w-full rounded-3xl border border-black/10 bg-white/90 backdrop-blur p-6 shadow-lg">
              <h2 class="text-2xl font-bold mb-2">Quick Setup</h2>
              <p class="text-sm opacity-70 mb-6">Two slider sets, PG-13 by default. Click <em>Start</em> to play.</p>

              <form id="setup-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Player A -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <label class="font-semibold">Player A</label>
                    <input class="border rounded px-2 py-1 text-sm bg-transparent w-36" name="nameA" placeholder="A" />
                  </div>
                  <label class="text-sm">Creativity</label><input name="A_creativity" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                  <label class="text-sm">Absurdism</label><input name="A_absurdism" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full">
                  <label class="text-sm">Romance</label><input name="A_romance" type="range" min="0" max="1" step="0.05" value="0.2" class="w-full">
                  <label class="text-sm">Pop Culture</label><input name="A_pop" type="range" min="0" max="1" step="0.05" value="0.3" class="w-full">
                  <label class="text-sm">Spice (PG-13 only)</label><input name="A_spice" type="range" min="0" max="1" step="0.05" value="0.1" class="w-full">
                  <label class="text-sm">Teenage Decade</label>
                  <select name="A_decade" class="border rounded px-2 py-1 bg-transparent w-full">
                    <option>1990s</option><option selected>2000s</option><option>2010s</option><option>1980s</option><option>1970s</option><option>2020s</option>
                  </select>
                </div>

                <!-- Player B -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <label class="font-semibold">Player B</label>
                    <input class="border rounded px-2 py-1 text-sm bg-transparent w-36" name="nameB" placeholder="B" />
                  </div>
                  <label class="text-sm">Creativity</label><input name="B_creivity" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full" />
                  <label class="text-sm">Absurdism</label><input name="B_absurdism" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                  <label class="text-sm">Romance</label><input name="B_romance" type="range" min="0" max="1" step="0.05" value="0.1" class="w-full">
                  <label class="text-sm">Pop Culture</label><input name="B_pop" type="range" min="0" max="1" step="0.05" value="0.4" class="w-full">
                  <label class="text-sm">Spice (PG-13 only)</label><input name="B_spice" type="range" min="0" max="1" step="0.05" value="0.2" class="w-full">
                  <label class="text-sm">Teenage Decade</label>
                  <select name="B_decade" class="border rounded px-2 py-1 bg-transparent w-full">
                    <option>1990s</option><option>2000s</option><option selected>2010s</option><option>1980s</option><option>1970s</option><option>2020s</option>
                  </select>
                </div>

                <div class="md:col-span-2 flex items-center justify-between pt-2">
                  <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="pg13" checked class="accent-emerald-600">
                    PG-13 Mode (default)
                  </label>
                  <button class="rounded-2xl px-5 py-3 bg-black text-white hover:brightness-110" id="start-btn" type="submit">Start →</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Game: card fixed to bottom center -->
        <section id="game" class="hidden">
          <div class="fixed inset-x-0 bottom-0 pb-[env(safe-area-inset-bottom)]">
            <div class="flex jus
