<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rather Be</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html, body { height: 100%; }

      /* Card + buttons */
      .card-dark { @apply rounded-3xl border border-white/10 bg-black/85 text-white backdrop-blur p-6 md:p-8 shadow-xl; }
      .big-rect { @apply w-full min-h-[3.25rem] md:min-h-[3.5rem] flex items-center justify-center select-none text-base md:text-xl font-semibold; }
      .btn-outline-light {
        @apply border-2 border-white/80 text-white hover:bg-white/10;
        border-radius: 16px; /* exact 16px radius as requested */
      }

      /* Background image holder */
      .bg-frame {
        position: fixed; inset: 0; z-index: -1;
        background: radial-gradient(80% 80% at 50% 20%, rgba(16,185,129,.08), transparent),
                    linear-gradient(180deg, rgba(15,23,42,.06), transparent);
        background-size: cover; background-position: center;
        filter: saturate(0.9);
        transition: background-image 0.35s ease, filter 0.35s ease;
      }
    </style>
  </head>
  <body class="bg-neutral-50 text-black antialiased">
    <div id="bg" class="bg-frame"></div>

    <div id="app" class="min-h-full flex flex-col">
      <!-- Header -->
      <header class="w-full border-b border-black/5">
        <div class="mx-auto max-w-3xl px-4 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="/static/logo.svg" class="h-8 w-auto" alt="logo" />
            <!-- Force black title text -->
            <h1 class="text-xl font-bold tracking-tight text-black">Rather Be</h1>
          </div>
          <!-- Status removed from UI (kept for layout only, empty) -->
          <div id="status" class="text-sm opacity-0 select-none">.</div>
        </div>
      </header>

      <!-- Main -->
      <main class="flex-1 flex items-center">
        <div class="mx-auto max-w-3xl w-full px-4 py-8">
          <!-- Onboarding -->
          <section id="onboarding" class="max-w-2xl mx-auto hidden">
            <div class="rounded-3xl border border-black/10 bg-white/70 backdrop-blur p-6 shadow-lg">
              <h2 class="text-2xl font-bold mb-2">Quick Setup</h2>
              <p class="text-sm opacity-70 mb-6">Two slider sets, PG-13 by default. Click <em>Start</em> to play.</p>

              <form id="setup-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Player A -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <label class="font-semibold">Player A</label>
                    <input class="border rounded px-2 py-1 text-sm bg-transparent w-36" name="nameA" placeholder="A" />
                  </div>
                  <label class="text-sm">Creativity</label><input name="A_creativity" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                  <label class="text-sm">Absurdism</label><input name="A_absurdism" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full">
                  <label class="text-sm">Romance</label><input name="A_romance" type="range" min="0" max="1" step="0.05" value="0.2" class="w-full">
                  <label class="text-sm">Pop Culture</label><input name="A_pop" type="range" min="0" max="1" step="0.05" value="0.3" class="w-full">
                  <label class="text-sm">Spice (PG-13 only)</label><input name="A_spice" type="range" min="0" max="1" step="0.05" value="0.1" class="w-full">
                  <label class="text-sm">Teenage Decade</label>
                  <select name="A_decade" class="border rounded px-2 py-1 bg-transparent w-full">
                    <option>1990s</option><option selected>2000s</option><option>2010s</option><option>1980s</option><option>1970s</option><option>2020s</option>
                  </select>
                </div>

                <!-- Player B -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <label class="font-semibold">Player B</label>
                    <input class="border rounded px-2 py-1 text-sm bg-transparent w-36" name="nameB" placeholder="B" />
                  </div>
                  <label class="text-sm">Creativity</label><input name="B_creivity" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full" />
                  <label class="text-sm">Absurdism</label><input name="B_absurdism" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                  <label class="text-sm">Romance</label><input name="B_romance" type="range" min="0" max="1" step="0.05" value="0.1" class="w-full">
                  <label class="text-sm">Pop Culture</label><input name="B_pop" type="range" min="0" max="1" step="0.05" value="0.4" class="w-full">
                  <label class="text-sm">Spice (PG-13 only)</label><input name="B_spice" type="range" min="0" max="1" step="0.05" value="0.2" class="w-full">
                  <label class="text-sm">Teenage Decade</label>
                  <select name="B_decade" class="border rounded px-2 py-1 bg-transparent w-full">
                    <option>1990s</option><option>2000s</option><option selected>2010s</option><option>1980s</option><option>1970s</option><option>2020s</option>
                  </select>
                </div>

                <div class="md:col-span-2 flex items-center justify-between pt-2">
                  <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="pg13" checked class="accent-emerald-600">
                    PG-13 Mode (default)
                  </label>
                  <button class="rounded-2xl px-5 py-3 bg-black text-white hover:brightness-110" id="start-btn" type="submit">Start →</button>
                </div>
              </form>
            </div>
          </section>

          <!-- Game Card -->
          <section id="game" class="max-w-xl mx-auto hidden">
            <div class="card-dark">
              <h2 id="question" class="text-2xl md:text-3xl font-bold leading-snug min-h-[3.75rem]"></h2>

              <div class="mt-6 grid grid-cols-1 gap-3">
                <button id="btn-x" class="big-rect btn-outline-light" aria-label="Choose left">
                  <span id="label-x">Option A</span>
                </button>
                <button id="btn-y" class="big-rect btn-outline-light" aria-label="Choose right">
                  <span id="label-y">Option B</span>
                </button>
              </div>
            </div>

            <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
