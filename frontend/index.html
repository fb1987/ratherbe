<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rather Be</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="min-h-screen bg-neutral-50 text-black antialiased">
    <div id="bg" class="bg-frame"></div>

    <div class="min-h-screen grid grid-rows-[auto,1fr]">
      <!-- Header -->
    <header class="header-bar sticky top-0 z-10">
      <div class="center-row py-2 md:py-3">
        <div class="flex justify-center">
          <img
            src="/static/logo.png"
            alt="Rather Be"
            class="h-[60px] md:h-[80px] w-auto select-none pointer-events-none"
          />
        </div>
      </div>
    </header>

      <!-- Main Stage -->
      <main class="relative">
        <!-- Onboarding -->
        <section id="onboarding" class="hidden">
          <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="max-w-xl w-full rounded-3xl border border-black/10 bg-white/90 backdrop-blur p-6 shadow-lg">
              <h2 class="text-2xl font-bold mb-2 text-center">Quick Setup</h2>
              <p class="text-sm opacity-70 mb-6 text-center">Set the vibe that feels right, then press <em>Start</em>.</p>

              <form id="setup-form" class="space-y-6">
                <div class="grid gap-5 sm:grid-cols-2">
                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="slider-creativity">Creativity</label>
                    <input id="slider-creativity" name="A_creativity" type="range" min="0" max="1" step="0.05" value="0.7" class="w-full">
                    <p class="text-xs opacity-70">Structured → Imaginative</p>
                  </div>

                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="slider-absurdism">Absurdism</label>
                    <input id="slider-absurdism" name="A_absurdism" type="range" min="0" max="1" step="0.05" value="0.5" class="w-full">
                    <p class="text-xs opacity-70">Grounded → Delightfully odd</p>
                  </div>

                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="slider-romance">Romance</label>
                    <input id="slider-romance" name="A_romance" type="range" min="0" max="1" step="0.05" value="0.2" class="w-full">
                    <p class="text-xs opacity-70">Platonic → Soft &amp; swoony</p>
                  </div>

                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="slider-pop">Pop Culture</label>
                    <input id="slider-pop" name="A_pop" type="range" min="0" max="1" step="0.05" value="0.3" class="w-full">
                    <p class="text-xs opacity-70">Timeless → Reference-packed</p>
                  </div>

                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="slider-spice">Spice</label>
                    <input id="slider-spice" name="A_spice" type="range" min="0" max="1" step="0.05" value="0.1" class="w-full">
                    <p class="text-xs opacity-70">Mild → Saucy (still PG-13)</p>
                  </div>

                  <div class="space-y-2">
                    <label class="font-semibold text-sm" for="select-decade">Teenage Decade</label>
                    <select id="select-decade" name="A_decade" class="border rounded px-2 py-1 bg-transparent w-full">
                      <option>1990s</option><option selected>2000s</option><option>2010s</option><option>1980s</option><option>1970s</option><option>2020s</option>
                    </select>
                  </div>
                </div>

                <div class="flex items-center justify-end pt-2">
                  <button class="btn" id="start-btn" type="submit">
                    <span id="start-spinner" class="spinner" style="display:none;"></span>
                    <span id="start-text">Start →</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Game: card fixed to bottom center -->
        <section id="game" class="hidden">
          <div class="stage-center">
            <div class="center-row">
              <div class="rb-card">
                <h2 id="question" class="rb-question text-2xl md:text-3xl min-h-[3.5rem]"></h2>

                <div class="rb-choices">
                  <button id="btn-x" class="rb-pill" aria-label="Choose left">
                    <span id="label-x">Option A</span>
                  </button>
                  <button id="btn-y" class="rb-pill" aria-label="Choose right">
                    <span id="label-y">Option B</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden"></div>
        </section>
      </main>
    </div>

    <!-- Load app + fallback to show onboarding if JS fails -->
    <link rel="modulepreload" href="/static/app.js" />
    <script type="module" src="/static/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const ob = document.getElementById('onboarding');
        if (ob) ob.classList.remove('hidden');
      });
    </script>
  </body>
</html>
